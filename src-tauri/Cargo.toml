[package]
name = "minerva"
version = "0.9.0"
description = "Minerva overlay shell: window lookup, Title Region capture and rendering around minerva-core"
authors = ["Jeffrey Davis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin (cargo#8519 on Windows).
name = "minerva_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
minerva-core = { path = "../crates/minerva-core" }
tauri = { version = "2.12", features = ["tray-icon"] }
# RegisterHotKey on Windows: no keyboard hook, no input sent anywhere (ADR 0001).
tauri-plugin-global-shortcut = "2.4"
# Opens the shown map's MeowDB page in the player's browser.
tauri-plugin-opener = "2"
# A second launch exits and tells the running Minerva, which shows itself.
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# OSMS Data Explorer's files and pictures (ADR 0008), and MeowDB's search (ADR 0007).
# OS TLS (SChannel on Windows): reqwest's default rustls
# backend builds aws-lc, which needs NASM/CMake.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "gzip"] }

[dev-dependencies]
image = { workspace = true, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# The side the page's corner grips start Windows' size loop by (Tauri doesn't re-export it).
tauri-runtime = "2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    # The Bug Report's Windows version and local time.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The game window, what is in front and the game's pixels, from the X server (XWayland's
# on a Wayland desktop), where Wine and Proton put the game.
x11rb = { version = "0.13", features = ["randr"] }
# Our windows' type, which window managers float and keep above (tao's GTK, as Tauri hands it).
gtk = "0.18"
# Our own windows' X11 IDs, to give one the keyboard.
raw-window-handle = "0.6"
# The Bug Report's local time.
libc = "0.2"
