<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/grind-tracker.css" />
    <title>Grind Tracker review harness</title>
    <style>
      /* The window over the game's busiest part (brick, poles, NPC names), not a margin.
         ?bg=dark puts it over a near-black scene instead, the worst case for the glass. */
      html {
        background: #222 url("/samples/minimap/victoria-road__kerning-city--window.png") no-repeat;
        background-size: 1916px auto;
        background-position: right -40px top -330px;
        overflow: visible !important;
      }
      html.dark { background: #0b0d12; }
      /* The window is 280 CSS px wide (WIDTH in src-tauri/src/grind_tracker.rs). */
      body { width: 280px; margin: 150px 16px 0 auto; overflow: visible !important; }
      #h { position: fixed; left: 6px; bottom: 6px; font: 12px monospace; color: #fff; background: #000a; padding: 2px 5px; }
    </style>
    <script>
      const cbs = {};
      let next = 1;
      window.__handlers = {};
      window.__pressed = [];
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "grind-tracker" }, currentWebview: { windowLabel: "grind-tracker", label: "grind-tracker" } },
        transformCallback(cb) { const id = next++; cbs[id] = cb; return id; },
        unregisterCallback(id) { delete cbs[id]; },
        async invoke(cmd, args) {
          if (cmd === "plugin:event|listen") { window.__handlers[args.event] = cbs[args.handler]; return 1; }
          if (cmd === "grind_tracker_height") { document.getElementById("h").textContent = "window " + args.height + "px"; }
          if (cmd === "panel_press") { window.__pressed.push(args.control); }
          return null;
        },
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
    </script>
  </head>
  <body class="draggable">
    <div id="h"></div>
    <script type="module">
      const page = new DOMParser().parseFromString(await (await fetch("/grind-tracker.html")).text(), "text/html");
      document.body.prepend(page.getElementById("panel"));
      await import("/src/grind-tracker.ts");
      const none = { count: 0, expLost: 0, percentLostHundredths: 0 };
      const bar = { exp: 8435, percentHundredths: 4172 };
      // An hour and 12 minutes in on the Construction Site (297,499 EXP/h solo).
      const tracking = (over = {}) => ({
        state: "active", timeToLevelS: 2820, timeToLevelBadge: "47m",
        rolling: { expPerHour: 61200, percentPerHourHundredths: 1290 },
        sessionAverage: { expPerHour: 58400, percentPerHourHundredths: 1230 },
        ceilingShareHundredths: 2050, soloExpCeiling: 297499,
        deaths: { count: 1, expLost: 120, percentLostHundredths: 210 },
        characterSwitched: false, activeS: 4320, rollingS: 300, resetUndoable: false, bar, personalBest: null, forgetUndoable: false, ...over,
      });
      // A moment `back` days ago (and `years` back), in local time, as the core dates bests.
      const daysAgo = (back, years = 0) => {
        const now = new Date();
        return new Date(now.getFullYear() - years, now.getMonth(), now.getDate() - back, 14, 20).getTime();
      };
      // The Personal Best line: a first Visit's best so far, or an earlier Visit's 66,500,
      // set 6 days ago, which Forget takes; this Visit's 74,500 once it beat it, set today,
      // which Forget takes then.
      const visitBest = (expPerHour, setAtUnixMs) => ({ expPerHour, setAtUnixMs });
      const best = (over = {}) => ({ kind: "earlierVisits", best: visitBest(66523, daysAgo(6)), shareHundredths: null, newBest: null, forgets: "earlierVisits", ...over });
      const thisVisit = visitBest(74512, daysAgo(0));
      const beaten = (over = {}) => best({ newBest: thisVisit, forgets: "thisVisit", ...over });
      const first = { kind: "firstVisit", best: visitBest(61200, daysAgo(0)), forgets: "thisVisit" };
      const empty = {
        timeToLevelS: null, timeToLevelBadge: null, rolling: null, sessionAverage: null,
        ceilingShareHundredths: null, soloExpCeiling: null, deaths: none, activeS: 0, rollingS: 0,
      };
      // Two minutes in: one rate, the whole Session; no share yet.
      const early = { activeS: 120, rollingS: 120, sessionAverage: { expPerHour: 61200, percentPerHourHundredths: 1290 }, ceilingShareHundredths: null, soloExpCeiling: null, deaths: none };
      // Every figure as long as it gets.
      const extreme = { timeToLevelBadge: "14h", rolling: { expPerHour: 1234567, percentPerHourHundredths: 12345 }, sessionAverage: { expPerHour: 987654, percentPerHourHundredths: 9876 }, activeS: 50400, ceilingShareHundredths: 41200, soloExpCeiling: 2999999, deaths: { count: 128, expLost: 999999, percentLostHundredths: 99999 }, bar: { exp: 1234567, percentHundredths: 9999 } };
      const states = {
        active: tracking(),
        early: tracking(early),
        waiting: tracking({ state: "waiting", ...empty }),
        warmingUp: tracking({ state: "warmingUp", timeToLevelBadge: "52m", activeS: 40, rollingS: 40, ceilingShareHundredths: null, soloExpCeiling: null, deaths: none }),
        // Just started, nothing gained since: Time to Level says why it has no figure, beside the tag.
        warmingUpNoGain: tracking({ state: "warmingUp", timeToLevelS: null, timeToLevelBadge: null, rolling: { expPerHour: 0, percentPerHourHundredths: 0 }, sessionAverage: { expPerHour: 0, percentPerHourHundredths: 0 }, activeS: 20, rollingS: 20, ceilingShareHundredths: null, soloExpCeiling: null, deaths: none, bar: { exp: 29590, percentHundredths: 6267 } }),
        paused: tracking({ state: "paused" }),
        unreadable: tracking({ state: "unreadable" }),
        unreadableWaiting: tracking({ state: "unreadable", ...empty, bar: null }),
        resetUndo: tracking({ state: "waiting", ...empty, resetUndoable: true }),
        switched: tracking({ state: "waiting", ...empty, characterSwitched: true, bar: { exp: 157, percentHundredths: 94 } }),
        switchedWarmingUp: tracking({ state: "warmingUp", ...early, activeS: 30, rollingS: 30, timeToLevelBadge: null, rolling: { expPerHour: 2160, percentPerHourHundredths: null }, characterSwitched: true, bar: { exp: 175, percentHundredths: 105 } }),
        losing: tracking({ timeToLevelS: null, timeToLevelBadge: null, rolling: { expPerHour: -3400, percentPerHourHundredths: -72 }, ceilingShareHundredths: null, soloExpCeiling: null, deaths: { count: 3, expLost: 9000, percentLostHundredths: 1930 } }),
        bestFirst: tracking({ personalBest: first }),
        bestEarly: tracking({ ...early, personalBest: best() }),
        bestShare: tracking({ personalBest: best({ shareHundredths: 9200 }) }),
        newBest: tracking({ rolling: { expPerHour: 74500, percentPerHourHundredths: 1570 }, personalBest: beaten({ shareHundredths: 11200 }) }),
        newBestBelow: tracking({ state: "paused", personalBest: beaten({ shareHundredths: 9200 }) }),
        // The pointer on the Personal Best line: it opens in place, the window grown to fit.
        hoverFirst: tracking({ personalBest: first }),
        hoverBest: tracking({ personalBest: best({ shareHundredths: 9200 }) }),
        hoverYesterday: tracking({ ...early, personalBest: best({ best: visitBest(66523, daysAgo(1)) }) }),
        hoverLastYear: tracking({ personalBest: best({ shareHundredths: 9200, best: visitBest(66523, daysAgo(6, 1)) }) }),
        hoverNewBest: tracking({ rolling: { expPerHour: 74500, percentPerHourHundredths: 1570 }, personalBest: beaten({ shareHundredths: 11200 }) }),
        hoverNewBestPaused: tracking({ state: "paused", personalBest: beaten({ shareHundredths: 9200 }) }),
        hoverExtreme: tracking({ ...extreme, personalBest: beaten({ best: visitBest(1104000, daysAgo(6, 1)), shareHundredths: 11180, newBest: visitBest(1234567, daysAgo(1)) }) }),
        // Forget pressed: the note at the top carries the Undo. This Visit's best forgotten,
        // the earlier one is left, with no share until 5 minutes after; the map's only best
        // forgotten, there is no line; a reset and a Forget both waiting on an Undo.
        forgotten: tracking({ forgetUndoable: true, personalBest: best() }),
        forgottenOnly: tracking({ forgetUndoable: true }),
        forgottenReset: tracking({ state: "waiting", ...empty, resetUndoable: true, forgetUndoable: true }),
        extreme: tracking(extreme),
      };
      const params = new URLSearchParams(location.search);
      document.documentElement.classList.toggle("dark", params.get("bg") === "dark");
      const s = params.get("s") ?? "active";
      // The hover states open the Personal Best line as the pointer would; the rest close it.
      window.__show = (name) => {
        window.__handlers["grind-tracker-state"]({ event: "grind-tracker-state", id: 1, payload: { shown: true, tracking: states[name] } });
        document.getElementById("tracking-best").dispatchEvent(new MouseEvent(name.startsWith("hover") ? "mouseenter" : "mouseleave"));
      };
      if (s === "all") {
        // A contact sheet: every state at once, each a still copy of the rendered window.
        await document.fonts.ready;
        const sheet = document.createElement("div");
        sheet.style.cssText = "position:absolute;left:10px;top:10px;display:grid;grid-template-columns:repeat(4,280px);gap:20px 18px;align-items:start";
        for (const name of Object.keys(states)) {
          window.__show(name);
          const caption = document.createElement("div");
          caption.textContent = name;
          caption.style.cssText = "font:11px monospace;color:#fff;background:#000b;padding:1px 4px;margin-bottom:3px;width:max-content";
          const copy = document.getElementById("panel").cloneNode(true);
          copy.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
          copy.removeAttribute("id");
          const cell = document.createElement("div");
          cell.append(caption, copy);
          sheet.append(cell);
        }
        document.getElementById("panel").remove();
        document.body.style.margin = "0";
        document.body.append(sheet);
      } else {
        window.__show(s);
      }
    </script>
  </body>
</html>
