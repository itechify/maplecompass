<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/search.css" />
    <link rel="stylesheet" href="/src/results.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleCompass mob search</title>
    <script type="module" src="/src/search.ts" defer></script>
  </head>
  <body>
    <header>
      <img src="/assets/icon.svg" width="28" height="28" alt="" />
      <h1>Mob search</h1>
      <span class="progress" id="crawl" role="status"></span>
    </header>
    <label class="field">
      <span class="label">Mob name</span>
      <input
        id="query"
        type="text"
        placeholder="Type part of a mob's name"
        autocomplete="off"
        spellcheck="false"
        role="combobox"
        aria-controls="suggestions"
        aria-expanded="false"
        aria-autocomplete="list"
      />
    </label>
    <ul class="suggestions" id="suggestions" role="listbox" aria-label="Mobs" hidden></ul>
    <p class="none" id="no-match" hidden>No known mob has that in its name.</p>
    <p class="keys">↑ ↓ choose a mob, or with nothing typed a map's route · Enter picks · Esc closes · Enter with nothing typed clears the search</p>
    <fieldset class="travel">
      <legend>Distance also counts</legend>
      <label title="Taxi rides between Lith Harbor, Henesys, Ellinia, Kerning City and Perion, one map change each">
        <input type="checkbox" id="taxis" /> Taxis
      </label>
      <label title="A scroll to the map's nearest town, or to Henesys, Ellinia, Perion, Kerning City, Lith Harbor, Sleepywood, Orbis or El Nath, one map change each">
        <input type="checkbox" id="teleport-scrolls" /> Teleport Scrolls
      </label>
    </fieldset>
    <section class="picked" id="picked" hidden>
      <h2 id="picked-title"></h2>
      <p class="nearest" id="picked-nearest" hidden></p>
      <p class="note" id="picked-note" role="status" hidden></p>
      <table class="results" id="results">
        <tbody id="result-rows"></tbody>
      </table>
      <section class="route" id="route" aria-live="polite" hidden>
        <h3 id="route-title"></h3>
        <ol class="route-stops" id="route-stops"></ol>
        <p class="note" id="route-none" hidden></p>
      </section>
      <p class="credit" id="credit"></p>
    </section>
  </body>
</html>
