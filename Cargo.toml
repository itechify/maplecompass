[workspace]
resolver = "3"
members = ["crates/minerva-core", "src-tauri"]
# Bare `cargo test` / `cargo build` only touch the headless core, never Tauri.
default-members = ["crates/minerva-core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false }

# Profiles are only honoured in the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# OCR in a debug build is very slow; optimise dependencies in dev/test.
[profile.dev.package."*"]
opt-level = 3
