<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark the minimap title</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
        /* Not fully transparent, so every pixel takes the mouse. */
        background: rgba(8, 14, 22, 0.35);
        font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 8px;
        background: rgba(16, 24, 36, 0.9);
        color: #f2f5f8;
        pointer-events: none;
        white-space: nowrap;
      }
      .box {
        position: fixed;
        border: 2px solid #f5c542;
        background: rgba(245, 197, 66, 0.12);
        box-sizing: border-box;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/region.ts" defer></script>
  </head>
  <body>
    <div class="hint">Drag a box around the two lines of the minimap title · Esc to cancel</div>
    <div class="box" id="box" hidden></div>
  </body>
</html>
