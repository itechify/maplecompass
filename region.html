<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark the minimap title</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
        /* Not fully transparent, so every pixel takes the mouse. */
        background: rgba(8, 14, 22, 0.35);
        font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 8px;
        background: rgba(16, 24, 36, 0.9);
        color: #f2f5f8;
        pointer-events: none;
        width: max-content;
        max-width: calc(100% - 64px);
        box-sizing: border-box;
        text-align: center;
        outline: none;
      }
      .hint h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      .hint p { margin: 4px 0; }
      .hint output { display: block; margin-top: 6px; color: #c3ccd6; font-size: 13px; font-variant-numeric: tabular-nums; }
      .box {
        position: fixed;
        border: 2px solid #f5c542;
        background: rgba(245, 197, 66, 0.12);
        box-sizing: border-box;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/region.ts" defer></script>
  </head>
  <body>
    <main class="hint" id="marking-hint" tabindex="-1" aria-labelledby="marking-title">
      <h1 id="marking-title">Mark both lines of the minimap title</h1>
      <p>Drag a box, or use Arrow keys to move · Alt+Arrow to resize · Shift for larger steps</p>
      <p>Enter to test · Esc to cancel</p>
      <output id="selection-status" role="status" aria-atomic="true"></output>
    </main>
    <div class="box" id="box" hidden></div>
  </body>
</html>
