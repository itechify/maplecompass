<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark the minimap title</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
        /* Not fully transparent, so every pixel takes the mouse. A navy veil, so the
           game reads as paused behind it. */
        background: rgba(18, 28, 56, 0.3);
        font: 14px/20px var(--font);
      }
      /* A small game window with what to do. */
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px 10px;
        border: 1px solid var(--frame);
        border-radius: 6px;
        background: var(--body);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
        color: var(--ink);
        font-weight: 700;
        pointer-events: none;
        white-space: nowrap;
      }
      .hint .key {
        padding: 0 6px;
        border: 1px solid var(--tag-edge);
        border-radius: 3px;
        background: var(--tag-bg);
        color: var(--tag-ink);
        font-size: 12px;
        line-height: 18px;
      }
      .hint .muted {
        color: var(--ink-2);
        font-weight: 400;
      }
      /* The box being dragged: the system's dashed edit blue over a solid white band,
         so it shows on the minimap's light blue and on dark scenery alike. Clear inside,
         so the title it frames reads at full strength. */
      .box {
        position: fixed;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.95);
        outline: 2px dashed var(--edit);
        outline-offset: -2px;
        background: none;
        pointer-events: none;
      }
      [hidden] {
        display: none;
      }
    </style>
    <script type="module" src="/src/region.ts" defer></script>
  </head>
  <body>
    <div class="hint">
      Drag a box around the two lines of the minimap title
      <span class="muted"><span class="key">Esc</span> to cancel</span>
    </div>
    <div class="box" id="box" hidden></div>
  </body>
</html>
