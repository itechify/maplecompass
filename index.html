<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleCompass</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body class="hidden">
    <main class="panel" id="panel">
      <header>
        <p class="street" id="street"></p>
        <div class="map-line"><p class="map" id="map">Starting…</p><span id="uncertainty" aria-label="Current Map is uncertain" hidden>?</span></div>
      </header>
      <p class="note" id="edit-hint" hidden></p>
      <p class="note" id="recovery" role="status" hidden></p>
      <p class="note problem" id="hotkey-problem" role="status" hidden></p>
      <section id="data" hidden>
        <section class="candidates" id="candidates" hidden>
          <p class="note" id="candidates-note"></p>
          <ol id="candidate-rows"></ol>
        </section>
        <p class="note" id="note" role="status"></p>
        <table class="summary" id="summary">
          <thead>
            <tr><th></th><th>Solo</th><th title="Party of six or more players" aria-label="Party of six or more players">6+</th></tr>
          </thead>
          <tbody>
            <tr><th>Mobs/h</th><td id="mobs-solo"></td><td id="mobs-party"></td></tr>
            <tr><th>EXP/h</th><td id="exp-solo"></td><td id="exp-party"></td></tr>
          </tbody>
        </table>
        <table class="mobs" id="mobs">
          <thead>
            <tr><th>Mob</th><th>Lv</th><th>HP</th><th>EXP</th><th>Count</th><th title="Share of all mob spawns on this Map" aria-label="Spawn Share">Share</th></tr>
          </thead>
          <tbody id="mob-rows"></tbody>
        </table>
        <section class="portals" id="portals">
          <h2>Hidden portals</h2>
          <p class="none" id="no-portals">None on this map</p>
          <ul id="portal-rows"></ul>
        </section>
      </section>
      <footer id="footer" hidden>
        <span id="credit"></span><span class="hint" id="open-hint"></span>
        <span class="hint" id="help-hint"></span>
      </footer>
    </main>
    <img class="icon" src="/assets/icon.svg" alt="MapleCompass" draggable="false" />
  </body>
</html>
