<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleCompass</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body class="hidden">
    <main class="panel" id="panel">
      <header>
        <p class="street" id="street"></p>
        <p class="map" id="map">Starting…</p>
      </header>
      <p class="note problem" id="hotkey-problem" hidden></p>
      <section class="tracking" id="tracking" hidden>
        <p class="waiting" id="tracking-waiting">EXP tracking: waiting for EXP</p>
        <div id="tracking-figures">
          <p class="headline">
            <span class="label">Time to Level</span>
            <span class="ttl" id="ttl"></span>
            <span class="tag" id="tracking-tag" hidden></span>
          </p>
          <table class="rates">
            <thead>
              <tr><th></th><th>Rolling 5 min</th><th>Session</th></tr>
            </thead>
            <!-- Meso and item rows come later, from the Pickup Log. -->
            <tbody>
              <tr><th>EXP/h</th><td id="rolling-exp"></td><td id="session-exp"></td></tr>
              <tr><th>%/h</th><td id="rolling-percent"></td><td id="session-percent"></td></tr>
            </tbody>
          </table>
          <p class="extra" id="tracking-extra" hidden></p>
        </div>
        <button type="button" class="reset" id="reset-session" hidden>Reset Session</button>
      </section>
      <section id="data" hidden>
        <section class="candidates" id="candidates" hidden>
          <p class="note" id="candidates-note"></p>
          <ol id="candidate-rows"></ol>
        </section>
        <p class="note" id="note"></p>
        <table class="summary" id="summary">
          <thead>
            <tr><th></th><th>Solo</th><th>6+</th></tr>
          </thead>
          <tbody>
            <tr><th>Mobs/h</th><td id="mobs-solo"></td><td id="mobs-party"></td></tr>
            <tr><th>EXP/h</th><td id="exp-solo"></td><td id="exp-party"></td></tr>
          </tbody>
        </table>
        <table class="mobs" id="mobs">
          <thead>
            <tr><th>Mob</th><th>Lv</th><th>HP</th><th>EXP</th><th>Count</th><th>Share</th></tr>
          </thead>
          <tbody id="mob-rows"></tbody>
        </table>
        <section class="portals" id="portals">
          <h2>Hidden portals</h2>
          <p class="none" id="no-portals">None on this map</p>
          <ul id="portal-rows"></ul>
        </section>
      </section>
      <footer id="footer" hidden>
        <span id="credit"></span><span class="hint" id="open-hint"></span>
      </footer>
    </main>
    <img class="icon" src="/assets/icon.svg" alt="MapleCompass" draggable="false" />
    <span class="badge" id="badge" hidden></span>
  </body>
</html>
