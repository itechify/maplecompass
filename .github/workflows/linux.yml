# Builds Minerva's Linux packages (.deb, .rpm and AppImage) from a release's tag when the
# release is published, and attaches them to it (docs/releasing.md). They are built on
# GitHub's oldest Ubuntu runner, so they need no newer C library than most players have
# (ADR 0013). Run it by hand to build them from another tag, branch or commit: they are
# kept with the run, and attached to that tag's release only when asked.
name: Linux packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build from (empty for the latest release's tag)
        required: false
        default: ""
      attach:
        description: Attach the packages to the release of that tag
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Choose the ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT" = release ]; then
            ref="$RELEASE_TAG"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Building the Linux packages from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - name: Install the libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf file
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Gather the packages
        run: |
          mkdir packages
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage packages/
          ls -l packages
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: packages/
      - name: Attach them to the release
        if: github.event_name == 'release' || inputs.attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.ref }}
        run: gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY"
