# Publishes the Minerva site (site/) to Cloudflare, at owlofminerva.app (site/wrangler.jsonc).
# It describes a release, so it is built from that release's tag when the release is
# published. Run it by hand to publish again: from the latest release's tag by default, or
# from another tag, branch or commit. A tag up to v0.9.0 has no site/wrangler.jsonc,
# so it won't publish. The `site` environment holds the Cloudflare API token
# (CLOUDFLARE_API_TOKEN) and lets only main and release tags use it. Publishing also
# deploys the Map Leaderboards API, so never publish from a ref older than it once it is
# live (docs/map-leaderboards-setup.md).
name: Site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build the site from (empty for the latest release's tag)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://owlofminerva.app/
    steps:
      - name: Choose the ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT" = release ]; then
            ref="$RELEASE_TAG"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Building the site from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      # npx rather than pnpm dlx, which won't run wrangler's install scripts unasked.
      # The Map Leaderboards' tables first, so the new Worker finds them (--remote: wrangler
      # applies to a local database by default). Migrations already applied are skipped.
      - name: Apply the database's migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply minerva-leaderboards --remote --config site/wrangler.jsonc
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config site/wrangler.jsonc
